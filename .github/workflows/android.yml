
name: Crear APK HYDROMEX

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager"
            exit 1
          fi
                    echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Instalar SDK Android
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: unzip -o HYDROMEX-Android-v1-1.zip -d .

      - name: Localizar proyecto
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "No se encontró el proyecto Android"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HYDROMEX-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
