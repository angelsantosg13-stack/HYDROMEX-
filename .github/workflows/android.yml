
name: Crear APK HYDROMEX

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: unzip -o HYDROMEX-Android-v1-1.zip -d .

      - name: Localizar proyecto
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HYDROMEX-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
